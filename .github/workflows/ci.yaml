name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-cpu-constraints.txt
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache CPU dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', '.github/ci-cpu-constraints.txt') }}
          restore-keys: |
            pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.56.1

      - name: Run tox (tests + lint + typecheck)
        env:
          STATIC_ANALYSIS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tox

      - name: Record CI environment and disk usage
        if: always()
        run: |
          mkdir -p .ci-reports
          python -m pip cache info
          du -sh ~/.cache/pip .tox || true
          df -h .
          .tox/py313/bin/python -m pip list --format=json > .ci-reports/dependencies.json

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-evidence
          path: |
            .ci-reports/
            .tox/static/tmp/static-analysis/
          include-hidden-files: true
