[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorhino-coral"
version = "0.1.16.dev0"
description = "Shared types and utilities for evalaution"
requires-python = ">=3.14"

license = "GPL-3.0-only"
license-files = ["LICENSE"]

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name = "Victor Gabillon", email = "victorgabillon@gmail.com" }
]

dependencies = [
"torch>=2.14.1",
    "valanga==0.2.5",
    "PyYAML",
    "dacite",
    "rich",
    "chess",


]




[project.optional-dependencies]
test = [
    # Testing dependencies
    "pytest==9.1.1",
    "coverage==7.17.0",
    "pytest-cov==7.1.0"
]


lint = [
  "ruff==0.17.3",
  "pylint==4.1.3",
]

typecheck = [
  "mypy==2.4.0",
  "pyright[nodejs]==1.1.414",
  "types-PyYAML==6.0.12.20260906",
]


dev = [
    # Development dependencies (includes test)
    "tox==4.67.2",
    "types-PyYAML==6.0.12.20260906",

    # Linting & formatting
    "ruff==0.17.3",
    "pylint==4.1.3",
    "black==26.10.1",

    # Type checking
    "mypy==2.4.0",
    "pyright==1.1.414",

    # Building & publishing
    "build==1.6.1",
    "twine==7.0.0",

    # Documentation
    "sphinx==9.2.0",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-autodoc-typehints==3.17.3",

    # Pre-commit hooks
    "pre-commit==4.7.0"


]


[tool.setuptools.package-data]
coral = ["py.typed"]


[tool.pytest.ini_options]
addopts = "--cov=coral"
testpaths = [
    "tests"
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.14"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
warn_unreachable = true
no_implicit_reexport = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# None and optional handling
no_implicit_optional = true

# Configuring warnings
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true

# Misc things
strict_equality = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py314"

# Enable import sorting (alphabetical + group order)
lint.select = ["I", "F", "E", "B", "TC","UP","SIM", "RUF","RET","N","A",
"ANN", "PERF", "TRY","LOG","RSE","ICN","TID","Q","W","D",
"ISC","PIE","ERA","TD"]  # I = imports, F = pyflakes, E = pycodestyle, TCH = type-checking, B = black

# Allow auto-fixing for imports and type-checking imports
lint.fixable = ["I", "TC", "F401","UP","W","D"]

# Ignore rules you don't care about
lint.ignore = [ "E501","ANN401","TD003","TD002",
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    ]

# Optional: add your first-party package to extend the known group
[tool.ruff.lint.per-file-ignores]
# If needed, can add file-specific ignores

# Configuration dataclasses and runtime protocols expose resolvable annotations.
[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "torch"]
runtime-evaluated-decorators = ["dataclasses.dataclass", "typing.runtime_checkable"]
runtime-evaluated-base-classes = ["typing.Protocol"]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.pylint]
py-version = "3.14"
extension-pkg-whitelist = ["PyQt5", "PySide6"]

[tool.pylint.format]
max-line-length = 88

#[tool.pylint.messages_control]
disable = ["C0301","W0511","R0903",    "unnecessary-ellipsis","R0902"]

[tool.pylint.typecheck]
# Optional: same as init-hook in .pylintrc
init-hook = "import sys; sys.path.append('.')"


[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportPrivateImportUsage = false


# Exact foundation wheels are supplied by CI or the isolated local environment.
[tool.tox]
min_version = "4.67.2"
env_list = ["py314", "lint", "typecheck", "build"]

[tool.tox.env_run_base]
base_python = ["python3.14"]
pass_env = ["TMPDIR", "XDG_CACHE_HOME", "PIP_CACHE_DIR", "PYTHONPYCACHEPREFIX", "MYPY_CACHE_DIR", "RUFF_CACHE_DIR", "PYLINTHOME", "PYRIGHT_PYTHON_FORCE_VERSION"]
set_env = { PYTHON_JIT = "0", COVERAGE_FILE = "{envtmpdir}/.coverage", OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" }

[tool.tox.env.py314]
package = "external"
description = "Complete installed-package tests and branch coverage"
extras = ["test"]
deps = ["{env:VALANGA_WHEEL}", "{env:TORCH_WHEEL}"]
commands = [["python", "scripts/ci_test_metrics.py", "--durations=30", "--cov-branch", "--cov-report=term", "--cov-report=json:{envtmpdir}/coverage.json", "--junitxml={envtmpdir}/pytest.xml", "-o", "cache_dir={envtmpdir}/pytest-cache", "--basetemp={envtmpdir}/pytest", "{posargs}"]]
set_env = { CI_REPORT_DIR = "{envtmpdir}", COVERAGE_FILE = "{envtmpdir}/.coverage", PYTHON_JIT = "0", OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" }

[tool.tox.env.lint]
description = "Ruff, formatting and strict pylint"
package = "skip"
deps = [
  "{env:VALANGA_WHEEL}",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "{env:TORCH_WHEEL}",
  "dacite>=1.9.2",
  "chess>=1.11.2",
  "ruff==0.17.3", "pylint==4.1.3",
]
set_env = { PYTHONPATH = "{toxinidir}/src", PYTHON_JIT = "0" }
commands = [
  ["python", "-m", "ruff", "check", "src", "tests", "scripts"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests", "scripts"],
  ["python", "-m", "pylint", "src/coral"],
]

[tool.tox.env.typecheck]
description = "Strict mypy, Pyright and positive/negative generic contracts"
package = "skip"
deps = [
  "{env:VALANGA_WHEEL}",
  "rich>=15.0.0",
  "PyYAML>=6.0.3",
  "{env:TORCH_WHEEL}",
  "dacite>=1.9.2",
  "chess>=1.11.2",
  "mypy==2.4.0", "pyright[nodejs]==1.1.414", "types-PyYAML==6.0.12.20260906",
]
set_env = { MYPYPATH = "{toxinidir}/src", PYTHONPATH = "{toxinidir}/src", PYTHON_JIT = "0" }
commands = [
  ["python", "-m", "mypy", "--strict", "src/coral", "tests/typing/contracts.py"],
  ["python", "-m", "pyright", "src/coral", "tests/typing/contracts.py"],
  ["python", "scripts/check_type_contracts.py"],
]

[tool.tox.env.build]
description = "Build wheel/sdist in private staging and validate strict metadata"
package = "skip"
deps = ["build==1.6.1", "twine==7.0.0"]
commands = [
  ["python", "scripts/build_distributions.py", "{envtmpdir}/dist"],
  ["python", "-m", "twine", "check", "--strict", "{envtmpdir}/dist/*"],
]

[tool.tox.env_pkg_base]
base_python = ["python3.14"]
deps = ["build==1.6.1"]
pass_env = ["TMPDIR", "PIP_CACHE_DIR", "PYTHONPYCACHEPREFIX", "XDG_CACHE_HOME"]
commands = [["python", "{toxinidir}/scripts/build_distributions.py", "{envtmpdir}/dist"]]
package_glob = "{envtmpdir}/dist/*.whl"
